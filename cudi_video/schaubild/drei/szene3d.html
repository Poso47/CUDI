<script src="../../data/three/three.min.js"></script>
<script>
/* CUDI Animationsstudio – 3D-Bühne (three.js r128, MIT). Python (schaubild/drei.py) berechnet je Bild den Zustand
   aller Elemente (Lage 0–100, Größe, Deckkraft, Füllung, Farbe, Kamera); hier wird er nur noch in 3D gezeichnet:
   Licht, weiche Schatten, Glanz, Tiefe, leichte Kamerafahrt. Zurück gehen PNG-Bilder + Bildschirmlage je Element
   (für die Beschriftungen, die Python wie bisher setzt). */
const W = 10;                                            // Bühnenbreite in Welt-Einheiten (0–100 -> -5..5)
const T = THREE;
let renderer, scene, camera, root, el = {}, size = 720, elemente = [];

const wx = (x) => (x - 50) / 100 * W, wy = (y) => -(y - 50) / 100 * W;
const rgb = (c) => new T.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();   // Farben wie im 2D-Bild
function mat(c, o = {}) {
  return new T.MeshPhysicalMaterial(Object.assign({ color: rgb(c), roughness: .45, metalness: 0, clearcoat: .35, clearcoatRoughness: .4 }, o));
}
function streifen(gelb, braun) {                         // Bienen-Hinterleib: Querstreifen als Textur
  const c = document.createElement("canvas"); c.width = 16; c.height = 256; const g = c.getContext("2d");
  g.fillStyle = gelb; g.fillRect(0, 0, 16, 256); g.fillStyle = braun;
  [[40, 30], [100, 30], [160, 30], [215, 41]].forEach(([y, h]) => g.fillRect(0, y, 16, h));
  const tx = new T.CanvasTexture(c); tx.encoding = T.sRGBEncoding; return tx;
}
function fell(farbe) {                                   // feines Rauschen als Fell/Struktur
  const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
  g.fillStyle = farbe; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? "255,240,200" : "60,30,10"},${Math.random() * .35})`;
    g.fillRect(Math.random() * 128, Math.random() * 128, 1.5, 3); }
  const tx = new T.CanvasTexture(c); tx.encoding = T.sRGBEncoding; tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.repeat.set(3, 3); return tx;
}
// Figurenraum wie in figur.json: 400 Einheiten, Mitte (200,200), y nach unten -> lokale Koordinaten (Breite 1)
const fp = (x, y, z = 0) => new T.Vector3((x - 200) / 400, -(y - 200) / 400, z);
function kugel(r, m, x, y, z = 0, sx = 1, sy = 1, sz = 1) {
  const k = new T.Mesh(new T.SphereGeometry(r, 40, 28), m); k.position.copy(fp(x, y, z)); k.scale.set(sx, sy, sz);
  k.castShadow = true; return k;
}
function rohr(pts, r, m) {
  const c = new T.CatmullRomCurve3(pts.map((p) => fp(p[0], p[1], p[2] || 0)));
  const t = new T.Mesh(new T.TubeGeometry(c, 40, r, 10, false), m); t.castShadow = true; return t;
}

function ringe(bump) {                                   // Hinterleib: Ringe quer zur Körperachse (Bänder entlang v)
  const c = document.createElement("canvas"); c.width = 64; c.height = 512; const g = c.getContext("2d");
  const verl = g.createLinearGradient(0, 0, 0, 512);
  verl.addColorStop(0, bump ? "#888" : "#b0742a"); verl.addColorStop(.5, bump ? "#888" : "#7e4c1c"); verl.addColorStop(1, bump ? "#888" : "#2e1c0c");
  g.fillStyle = verl; g.fillRect(0, 0, 64, 512);
  for (let i = 0; i < 5; i++) { const y = 70 + i * 80, h = 22 + i * 7;
    g.fillStyle = bump ? "#333" : "rgba(32,20,9,.93)"; g.fillRect(0, y, 64, h);
    g.fillStyle = bump ? "#ddd" : "rgba(214,178,120,.55)"; g.fillRect(0, y - 4, 64, 4); }
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(${bump ? "255,255,255" : "255,226,170"},${Math.random() * .1})`; g.fillRect(Math.random() * 64, Math.random() * 512, 1, 2); }
  const tx = new T.CanvasTexture(c); if (!bump) tx.encoding = T.sRGBEncoding; return tx;
}
function facetten() {                                    // Facettenauge: feines Wabenmuster als Relief
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  g.fillStyle = "#808080"; g.fillRect(0, 0, 256, 256); g.strokeStyle = "#000"; g.lineWidth = 1;
  for (let y = 0; y < 256; y += 7) for (let x = 0; x < 256; x += 8) { g.beginPath(); g.arc(x + (y / 7 % 2) * 4, y, 3.4, 0, 7); g.stroke(); }
  const tx = new T.CanvasTexture(c); tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.repeat.set(2, 2); return tx;
}
function adern() {                                       // Flügel: rauchig-durchsichtig mit dunklen Adern
  const c = document.createElement("canvas"); c.width = 512; c.height = 256; const g = c.getContext("2d");
  g.fillStyle = "rgba(235,228,210,.5)"; g.fillRect(0, 0, 512, 256);
  g.strokeStyle = "rgba(60,40,20,.85)"; g.lineWidth = 3;
  const linie = (pts) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) g.lineTo(p[0], p[1]); g.stroke(); };
  linie([[512, 120], [300, 70], [40, 110]]); linie([[512, 128], [260, 150], [60, 140]]); linie([[300, 70], [250, 150]]);
  linie([[200, 80], [180, 145]]); linie([[140, 95], [110, 140]]); linie([[260, 150], [200, 200], [80, 190]]); g.lineWidth = 2;
  linie([[250, 112], [140, 120]]); linie([[90, 105], [70, 160]]);
  const tx = new T.CanvasTexture(c); tx.encoding = T.sRGBEncoding; return tx;
}
function haare(ziel, n, r, farbe, laenge, nur) {         // Fell aus vielen feinen Härchen (instanziert, schnell)
  const geo = new T.ConeGeometry(.0018, 1, 3); geo.translate(0, .5, 0);
  const m = new T.MeshStandardMaterial({ color: rgb(farbe), roughness: .9 });
  const inst = new T.InstancedMesh(geo, m, n); const d = new T.Object3D(); let k = 0;
  const pos = ziel.geometry.attributes.position, nor = ziel.geometry.attributes.normal;
  for (let i = 0; i < n * 4 && k < n; i++) {
    const j = Math.floor(Math.random() * pos.count), p = new T.Vector3().fromBufferAttribute(pos, j);
    if (nur && !nur(p)) continue;
    const no = new T.Vector3().fromBufferAttribute(nor, j).multiplyScalar(.55)            // nach hinten gekämmt, nicht stachelig
      .add(new T.Vector3(-.75, .15, 0)).add(new T.Vector3((Math.random() - .5) * .5, (Math.random() - .5) * .5, (Math.random() - .5) * .5)).normalize();
    d.position.copy(p); d.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), no);
    const s = laenge * (.6 + Math.random() * .8); d.scale.set(1, s, 1); d.updateMatrix(); inst.setMatrixAt(k, d.matrix);
    const hell = .75 + Math.random() * .5; inst.setColorAt(k, rgb(farbe.map((v) => Math.min(255, v * hell)))); k++;
  }
  inst.count = k; inst.castShadow = false; inst.frustumCulled = false;
  inst.scale.set(1 / ziel.scale.x, 1 / ziel.scale.y, 1 / ziel.scale.z);   // Härchen nicht mitstrecken
  const halter = new T.Group(); halter.add(inst); halter.scale.copy(ziel.scale);
  ziel.add(inst); inst.scale.set(1, 1, 1); return inst;
}
function umgebung() {                                    // weiches Studio-Umgebungslicht für echte Spiegelungen (ohne Download)
  const pm = new T.PMREMGenerator(renderer), s = new T.Scene();
  const himmel = new T.Mesh(new T.SphereGeometry(20, 32, 16), new T.MeshBasicMaterial({ side: T.BackSide, vertexColors: true }));
  const farben = [], p = himmel.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 20; const c = new T.Color().setHSL(.1, .25, .12 + .55 * Math.max(0, y)); farben.push(c.r, c.g, c.b); }
  himmel.geometry.setAttribute("color", new T.Float32BufferAttribute(farben, 3)); s.add(himmel);
  [[0, 12, 6, 4], [-10, 3, 8, 2], [10, 5, -6, 1.5]].forEach(([x, y, z, st]) => { const l = new T.Mesh(new T.PlaneGeometry(8, 5), new T.MeshBasicMaterial({ color: new T.Color(st, st, st * .95), side: T.DoubleSide }));
    l.position.set(x, y, z); l.lookAt(0, 0, 0); s.add(l); });
  return pm.fromScene(s, .02).texture;
}

function blatttextur() {                                 // Cosmeen-Blütenblatt: Verlauf zur Mitte kräftiger, feine Adern, gekerbte Spitze
  const c = document.createElement("canvas"); c.width = 256; c.height = 128; const g = c.getContext("2d");
  const v = g.createLinearGradient(0, 0, 256, 0); v.addColorStop(0, "#b8287a"); v.addColorStop(.35, "#e45ba8"); v.addColorStop(1, "#f6b8dc");
  g.fillStyle = v; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = "rgba(150,20,90,.35)"; g.lineWidth = 1;
  for (let i = 0; i < 16; i++) { g.beginPath(); g.moveTo(0, 64); g.quadraticCurveTo(140, 64 + (i - 7.5) * 4, 256, 8 + i * 7.5); g.stroke(); }
  g.globalCompositeOperation = "destination-out";
  for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(256, i * 28 + 4); g.lineTo(236, i * 28 + 14); g.lineTo(256, i * 28 + 24); g.fill(); }   // Kerben
  const tx = new T.CanvasTexture(c); tx.encoding = T.sRGBEncoding; return tx;
}
function federn(grund, rand) {                           // Gefieder: geschuppte Federn mit dunklem Rand
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  g.fillStyle = grund; g.fillRect(0, 0, 256, 256);
  for (let y = -8; y < 264; y += 14) for (let x = -8; x < 264; x += 16) {
    const ox = x + (y / 14 % 2) * 8; g.beginPath(); g.ellipse(ox, y, 9, 12, 0, 0, Math.PI);
    g.fillStyle = grund; g.fill(); g.strokeStyle = rand; g.lineWidth = 2; g.stroke(); }
  const tx = new T.CanvasTexture(c); tx.encoding = T.sRGBEncoding; tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.repeat.set(3, 2); return tx;
}
function wabe() {                                        // Honigwabe (Vorlage „honeycomb cells honey macro“): Wachszellen, Honig, Deckel
  const g = new T.Group(), r = .17, wachs = mat([238, 210, 140], { roughness: .55, clearcoat: .2 });
  const honig = new T.MeshPhysicalMaterial({ color: rgb([200, 110, 10]), roughness: .05, clearcoat: 1 });
  const deckel = mat([245, 236, 205], { roughness: .7 });
  const zellen = [[0, 0]]; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; zellen.push([Math.cos(a) * r * 1.73, Math.sin(a) * r * 1.73]); }
  zellen.forEach(([x, y], i) => {
    const wand = new T.Mesh(new T.CylinderGeometry(r, r, .22, 6, 1, true), new T.MeshPhysicalMaterial({ color: rgb([238, 210, 140]), roughness: .5, side: T.DoubleSide }));
    wand.rotation.x = Math.PI / 2; wand.position.set(x, y, 0); wand.castShadow = true; g.add(wand);
    const rand = new T.Mesh(new T.TorusGeometry(r * .96, .012, 6, 6), wachs); rand.rotation.z = Math.PI / 6; rand.position.set(x, y, .11); g.add(rand);
    const fuell = new T.Mesh(new T.CylinderGeometry(r * .93, r * .93, .02, 6), i === 4 ? deckel : honig);
    fuell.rotation.x = Math.PI / 2; fuell.position.set(x, y, i === 4 ? .1 : .06); g.add(fuell);
  });
  g.scale.setScalar(.95); return g;
}
function glas(farbe) {                                   // Messglas mit Flüssigkeit – Mengen/Anteile (Füllstand = „fuelle“)
  const g = new T.Group();
  const huelle = new T.Mesh(new T.CylinderGeometry(.3, .28, 1, 40, 1, true), new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: .05,
    transmission: .9, transparent: true, opacity: .35, clearcoat: 1, side: T.DoubleSide, depthWrite: false }));
  g.add(huelle);
  const boden = new T.Mesh(new T.CylinderGeometry(.28, .28, .03, 40), new T.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: .4, roughness: .05 }));
  boden.position.y = -.5; g.add(boden);
  const fl = new T.Mesh(new T.CylinderGeometry(.27, .265, 1, 40), new T.MeshPhysicalMaterial({ color: rgb(farbe), roughness: .1, clearcoat: 1,
    transparent: true, opacity: .8 })); fl.geometry.translate(0, .5, 0); fl.position.y = -.49; g.add(fl);
  for (let i = 1; i < 5; i++) { const s = new T.Mesh(new T.BoxGeometry(.08, .006, .01), new T.MeshBasicMaterial({ color: 0xdddddd }));
    s.position.set(-.22, -.5 + i * .2, .27); g.add(s); }                      // Skala
  return { g, fl };
}

const FIGUREN = {
  biene() {
    // Vorlage: Nahaufnahmen vom Referenz-Scout (python -m cudi_video referenzen "honey bee apis mellifera macro"):
    // dichtes goldbraunes Brustfell, dunkler Kopf mit großem glänzenden Nierenauge, geknickte Fühler, spitzer Hinterleib
    // mit Bernstein-/Dunkelbraun-Ringen und hellen Haarsäumen, rauchige Adernflügel über dem Hinterleib, glänzende Beine.
    const g = new T.Group(), teile = {};
    // Hinterleib: Drehkörper (vorn rund, hinten spitz) mit Ringen + Haarsäumen
    const prof = []; for (let i = 0; i <= 30; i++) { const u = i / 30;
      prof.push(new T.Vector2(Math.max(.002, Math.sin(Math.PI * Math.pow(u, .85)) * (.5 - .18 * u)), .5 - u)); }
    const lg = new T.LatheGeometry(prof.reverse(), 48); lg.rotateZ(Math.PI / 2);   // Kontur von unten nach oben = Normalen nach außen
    const leib = new T.Mesh(lg, mat([255, 255, 255], { map: ringe(), bumpMap: ringe(true), bumpScale: .01, roughness: .55, clearcoat: .25, clearcoatRoughness: .5 }));
    leib.position.copy(fp(152, 222)); leib.scale.set(.43, .32, .32); leib.rotation.z = .12; leib.castShadow = true; g.add(leib); teile.koerper = leib;
    haare(leib, 350, .5, [222, 186, 120], .018);                               // feiner heller Flaum
    // Brust: rund, dicht behaart
    const brust = kugel(.13, mat([168, 118, 58], { roughness: 1, clearcoat: 0 }), 246, 198, 0, 1.05, 1, 1); g.add(brust);
    haare(brust, 3200, .13, [196, 150, 84], .016); haare(brust, 900, .13, [230, 196, 130], .022);
    // Taille
      // Kopf: dunkel, leicht dreieckig, goldenes Gesichtshaar, großes Nierenauge
    const kopf = new T.Group(); kopf.position.copy(fp(292, 200)); g.add(kopf); teile.kopf = kopf;
    const add = (o) => { o.position.sub(kopf.position); kopf.add(o); return o; };
    const kk = add(kugel(.085, mat([46, 30, 18], { roughness: .55, clearcoat: .4 }), 312, 200, 0, .9, 1.1, .85));
    haare(kk, 300, .085, [200, 160, 92], .012, (p) => p.x > .02);
    for (const s of [-1, 1]) {
      const auge = add(kugel(.05, mat([10, 10, 14], { roughness: .08, clearcoat: 1, clearcoatRoughness: .05, bumpMap: facetten(), bumpScale: .004 }),
        312, 190, s * .055, .75, 1.35, .55));
      auge.rotation.z = -.25;
      // Fühler: kurzer Schaft nach oben, dann geknickt nach vorn, gegliedert
      const fh = mat([28, 18, 10], { roughness: .4, clearcoat: .6 });
      add(rohr([[318, 168, s * .03], [322, 140, s * .04], [324, 126, s * .045]], .006, fh));
      add(rohr([[324, 126, s * .045], [346, 122, s * .05], [366, 132, s * .055], [378, 148, s * .055]], .005, fh));
      for (let k = 0; k < 8; k++) { const t = k / 7; add(kugel(.0065, fh, 324 + 54 * t, 126 + 22 * t * t, s * (.045 + .01 * t))); }
    }
    add(rohr([[322, 228], [326, 240]], .009, mat([60, 36, 16])));       // Mundwerkzeuge
    const ruessel = add(rohr([[326, 238], [332, 252], [340, 266]], .006, mat([90, 55, 22], { clearcoat: .8 }))); teile.ruessel = ruessel;
    // Beine: drei Paare, gegliedert, glänzend dunkel; Hinterbein mit Haaren + Pollenhöschen
    const bm = mat([24, 16, 10], { roughness: .3, clearcoat: .9 });
    const beine = [[[228, 232], [206, 262], [196, 296], [204, 318]], [[248, 236], [256, 270], [250, 302], [258, 320]],
                   [[266, 232], [292, 258], [304, 290], [318, 306]]];
    for (const s of [-1, 1]) beine.forEach((b, i) => {
      const bein = rohr(b.map((q) => [q[0], q[1], s * (.05 + i * .006)]), .008 - i * .001, bm); g.add(bein);
      b.slice(1, 3).forEach((q) => g.add(kugel(.011, bm, q[0], q[1], s * (.05 + i * .006))));
      if (i === 0) haare(bein, 50, .01, [180, 130, 70], .01);
    });
    g.add(kugel(.02, mat([235, 170, 30], { roughness: .85 }), 204, 290, .07, 1, 1.3, .8));       // Pollenhöschen
    // Flügel: schmal, rauchig, mit Adern; in Ruhe über dem Hinterleib, schlagen bei „flattere“
    const flg = new T.Group(); flg.position.copy(fp(236, 158)); g.add(flg); teile.fluegel = flg;
    const fm = new T.MeshPhysicalMaterial({ map: adern(), color: 0xffffff, transparent: true, opacity: .85, roughness: .2,
      clearcoat: 1, side: T.DoubleSide, depthWrite: false });
    const fluegelForm = (l, b) => { const sh = new T.Shape(); sh.moveTo(0, 0); sh.bezierCurveTo(-l * .3, b * 1.1, -l * .8, b * .9, -l, b * .15);
      sh.bezierCurveTo(-l * .95, -b * .35, -l * .4, -b * .45, 0, 0); return sh; };
    [[.3, .085, .12], [.22, .06, -.05]].forEach(([l, b, rot], j) => {
      for (const s of [-1, 1]) {
        const geo = new T.ShapeGeometry(fluegelForm(l, b), 32);
        geo.computeBoundingBox(); const bb = geo.boundingBox, uv = geo.attributes.uv, pos = geo.attributes.position;
        for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) - bb.min.x) / (bb.max.x - bb.min.x), (pos.getY(i) - bb.min.y) / (bb.max.y - bb.min.y));
        const m = new T.Mesh(geo, fm); m.rotation.z = rot + .12; m.rotation.x = s * .35; m.position.z = s * (.09 + j * .015);
        const halter = new T.Group(); halter.add(m); halter.userData.seite = s; flg.add(halter);
      }
    });
    return { g, teile };
  },
  bluete() {
    // Vorlage (Referenz-Scout „cosmos daisy flower close up“): 8 breite, gekerbte Blütenblätter mit feinen Adern, zur Mitte kräftiger
    // gefärbt; gewölbte gelbe Mitte aus winzigen Einzelblüten mit dunklen Staubgefäßen; dünner Stiel, gefiederte Blätter.
    const g = new T.Group(), teile = {};
    const stiel = rohr([[200, 176], [194, 250], [206, 320], [200, 378]], .009, mat([86, 150, 60], { roughness: .6 }));
    g.add(stiel); teile.beine = stiel;
    const laub = mat([70, 140, 52], { roughness: .55 });
    [[[200, 290], [250, 262], [292, 250]], [[200, 290], [244, 300], [280, 318]], [[200, 330], [150, 304], [112, 300]], [[200, 330], [158, 342], [126, 360]]]
      .forEach((p) => g.add(rohr(p, .004, laub)));                                 // gefiederte, dünne Cosmeen-Blätter
    const kopf = new T.Group(); kopf.position.copy(fp(200, 150)); g.add(kopf); teile.koerper = kopf;
    const tex = blatttextur(), bm = new T.MeshPhysicalMaterial({ map: tex, side: T.DoubleSide, roughness: .55, alphaTest: .4,
      transparent: true });
    for (let i = 0; i < 8; i++) {
      const geo = new T.PlaneGeometry(1, 1, 16, 6), p = geo.attributes.position;
      for (let k = 0; k < p.count; k++) {
        const u = p.getX(k) + .5, v = p.getY(k);
        const breite = .34 * Math.pow(Math.sin(Math.PI * Math.min(1, u * .62 + .05)), .8) + .05;
        p.setXYZ(k, u * .27, v * breite * .27, .03 * Math.sin(u * 2.6) + .012 * Math.cos(v * 6) * u);   // gewölbt, leicht gewellt
      }
      geo.computeVertexNormals();
      const b = new T.Mesh(geo, bm); b.rotation.z = i * Math.PI / 4 + .2; b.rotation.y = -.12; b.castShadow = true; kopf.add(b);
    }
    const mitte = new T.Group(); kopf.add(mitte); teile.kopf = mitte;
    const kuppel = new T.Mesh(new T.SphereGeometry(.07, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2.4), mat([214, 150, 20], { roughness: .8 }));
    kuppel.rotation.x = Math.PI / 2; kuppel.scale.set(1, .45, 1); kuppel.position.z = .005; mitte.add(kuppel);
    const flor = new T.InstancedMesh(new T.ConeGeometry(.006, .014, 5), mat([255, 200, 40], { roughness: .7 }), 260), d = new T.Object3D();
    for (let i = 0; i < 260; i++) { const r = Math.sqrt(i / 260) * .066, a = i * 2.39996;                     // goldener Winkel wie in echten Blütenköpfen
      d.position.set(Math.cos(a) * r, Math.sin(a) * r, .03 * (1 - (r / .07) ** 2) + .012); d.rotation.set(Math.PI / 2, 0, 0); d.updateMatrix(); flor.setMatrixAt(i, d.matrix); }
    mitte.add(flor);
    for (let i = 0; i < 18; i++) { const a = i * 2.1, r = .02 + (i % 5) * .009;
      const s = new T.Mesh(new T.CylinderGeometry(.0025, .0025, .02, 6), mat([60, 30, 10])); s.position.set(Math.cos(a) * r, Math.sin(a) * r, .04);
      s.rotation.x = Math.PI / 2; mitte.add(s); }
    return { g, teile };
  },
  huhn() {
    // Vorlage („hen chicken side view“): gezackter roter Kamm, Kehllappen, nackte rote Gesichtshaut, oranges Auge, gebogener gelber
    // Schnabel, braunes Gefieder mit dunklen Federrändern, lange Halsfedern, dunkler glänzender Schwanz, gelbe geschuppte Beine.
    const g = new T.Group(), teile = {};
    const gefieder = mat([255, 255, 255], { map: federn("#9a5a26", "#5a2e10"), roughness: .85, clearcoat: .1 });
    const leib = kugel(.5, gefieder, 205, 248, 0, .56, .4, .38); g.add(leib); teile.koerper = leib;
    const flg = new T.Group(); flg.position.copy(fp(160, 205)); g.add(flg); teile.fluegel = flg;
    const fl = kugel(.5, mat([255, 255, 255], { map: federn("#7a4418", "#3a1c08"), roughness: .8 }), 210, 228, .14, .34, .17, .06);
    fl.position.sub(flg.position); flg.add(fl);
    const hals = new T.Mesh(new T.CylinderGeometry(.06, .11, .2, 24), gefieder); hals.position.copy(fp(272, 172)); hals.rotation.z = -.55; g.add(hals);
    haare(hals, 700, .1, [190, 120, 50], .05);                                       // lange Halsfedern
    const kopf = new T.Group(); kopf.position.copy(fp(268, 200)); g.add(kopf); teile.kopf = kopf;
    const add = (o) => { o.position.sub(kopf.position); kopf.add(o); return o; };
    add(kugel(.072, gefieder, 300, 118, 0, 1.05, 1, .9));
    add(kugel(.05, mat([214, 80, 70], { roughness: .55 }), 312, 122, .03, 1, .9, .7));            // nackte rote Gesichtshaut
    const kamm = mat([210, 30, 36], { roughness: .4, clearcoat: .6 });
    [[284, 92, .028], [296, 82, .032], [308, 80, .03], [320, 86, .025], [330, 96, .02]].forEach(([x, y, r]) => add(kugel(r, kamm, x, y, 0, .8, 1.3, .55)));
    add(kugel(.03, kamm, 326, 150, 0, .8, 1.3, .5)); add(kugel(.024, kamm, 316, 156, .01, .8, 1.2, .5));   // Kehllappen
    const auge = add(kugel(.016, mat([220, 120, 20], { roughness: .1, clearcoat: 1 }), 318, 112, .055));
    add(kugel(.008, mat([5, 5, 5], { roughness: .05, clearcoat: 1 }), 320, 112, .068));
    const schnabel = new T.Mesh(new T.ConeGeometry(.024, .075, 20), mat([228, 176, 70], { roughness: .35, clearcoat: .6 }));
    schnabel.rotation.z = -Math.PI / 2 - .25; schnabel.position.copy(fp(350, 126)); add(schnabel);
    const schwanz = new T.Group(); schwanz.position.copy(fp(122, 200)); g.add(schwanz); teile.schwanz = schwanz;
    const sm = mat([30, 26, 22], { roughness: .25, clearcoat: .9, clearcoatRoughness: .2 });
    for (let i = 0; i < 6; i++) { const f = kugel(.5, sm, 128 - i * 4, 196 - i * 9, -.04 + i * .016, .2, .045, .025);   // Sichelfedern am Rücken
      f.rotation.z = .55 + i * .16; f.position.sub(schwanz.position); schwanz.add(f); }
    const bein = mat([230, 190, 70], { roughness: .4, clearcoat: .4 });
    for (const x of [188, 226]) { g.add(rohr([[x, 300], [x - 2, 336], [x, 364]], .012, bein));
      for (const dx of [28, 14, -18]) g.add(rohr([[x, 364], [x + dx, 370]], .007, bein)); }
    return { g, teile };
  },
};

function tropfenGeo() {
  const pts = []; for (let i = 0; i <= 24; i++) { const t = i / 24, a = t * Math.PI;
    pts.push(new T.Vector2(Math.sin(a) * .5 * Math.pow(Math.sin(a / 2 + .2), .6) * (t > .5 ? 1 : t * 1.6 + .2), .55 - t * 1.05)); }
  return new T.LatheGeometry(pts, 40);
}
function herzGeo() {
  const s = new T.Shape(); s.moveTo(0, -.45); s.bezierCurveTo(-.55, -.05, -.45, .45, 0, .2); s.bezierCurveTo(.45, .45, .55, -.05, 0, -.45);
  const g = new T.ExtrudeGeometry(s, { depth: .25, bevelEnabled: true, bevelThickness: .08, bevelSize: .06, bevelSegments: 6, curveSegments: 24 });
  g.center(); return g;
}
function formGeo(f) {
  if (f === "ei") { const g = new T.SphereGeometry(.5, 48, 32); g.scale(.82, 1, .82); return g; }
  if (f === "tropfen") return tropfenGeo();
  if (f === "quadrat") return new T.BoxGeometry(.85, .85, .5, 4, 4, 4);
  if (f === "sechseck") { const g = new T.CylinderGeometry(.5, .5, .32, 6); g.rotateX(Math.PI / 2); g.rotateZ(Math.PI / 6); return g; }
  if (f === "herz") return herzGeo();
  return new T.SphereGeometry(.5, 48, 32);
}

function baue(e) {                                       // ein Element -> Objekt3D (Lage/Größe setzt jedes Bild neu)
  const o = { e, obj: new T.Group() };
  const farbe = e.farbe || [200, 200, 200];
  if (e.art === "figur" && FIGUREN[e.figur]) {
    const f = FIGUREN[e.figur](); o.teile = f.teile; o.innen = f.g; o.obj.add(f.g);
    if (e.blick < 0) f.g.scale.x = -1;
    if (e.durchsichtig && f.teile.koerper) f.teile.koerper.traverse((m) => { if (m.material) { m.material = m.material.clone(); m.material.transparent = true; m.material.opacity = .55; } });
  } else if (e.art === "form" || e.art === "figur") {
    o.mat = mat(farbe, { transparent: true, opacity: e.deckkraft ?? 1 });
    if (e.form === "sechseck") { o.obj.add(wabe()); }                              // Wabe statt flachem Sechseck
    else if (e.form === "quadrat" && (e.streckung || 1) >= 1.3) {                   // hohe Säule = Messglas mit Füllstand
      const gl = glas(farbe); gl.g.scale.set(.75, e.streckung || 1.6, .75); o.obj.add(gl.g); o.fluessig = gl.fl; o.mat = gl.fl.material;
    } else { const m = new T.Mesh(formGeo(e.form), o.mat); m.castShadow = true; m.scale.y = e.streckung || 1; o.obj.add(m); o.mesh = m; }
  } else if (e.art === "schlauch" || e.art === "pfeil") {
    o.kurve = new T.CatmullRomCurve3(e.punkte.map((p) => new T.Vector3(wx(p[0]), wy(p[1]), 0)));
    o.mat = mat(farbe, { transparent: true, opacity: e.durchsichtig ? .35 : 1, roughness: .3, clearcoat: .8 });
    o.r = Math.max(.02, (e.breite || 8) / 100 * W / 2 * (e.art === "pfeil" ? .25 : 1));
    o.geo = new T.TubeGeometry(o.kurve, 160, o.r, 16, false); o.mesh = new T.Mesh(o.geo, o.mat); o.mesh.castShadow = true; o.obj.add(o.mesh);
    if (e.art === "pfeil") { const n = o.kurve.getPoints(2), a = n[n.length - 1], b = n[n.length - 2];
      const k = new T.Mesh(new T.ConeGeometry(o.r * 3, o.r * 7, 20), o.mat); k.position.copy(a);
      k.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), a.clone().sub(b).normalize()); o.obj.add(k); }
  } else if (e.art === "huelle" || e.art === "schale") {
    o.mat = mat(farbe, { transparent: true, opacity: e.art === "huelle" ? .3 : .9, roughness: .15, transmission: e.art === "huelle" ? .5 : 0, depthWrite: false });
    o.mesh = new T.Mesh(new T.SphereGeometry(.5, 48, 32), o.mat); o.obj.add(o.mesh);
  } else if (e.art === "kristalle" || e.art === "partikel" || e.art === "traube") {
    o.mat = mat(farbe, { roughness: .3, clearcoat: .9 }); o.stuecke = [];
    const n = e.art === "traube" ? (e.anzahl || 9) : 28;
    for (let i = 0; i < n; i++) { const m = new T.Mesh(e.art === "kristalle" ? new T.IcosahedronGeometry(.5, 0) : new T.SphereGeometry(.5, 20, 14), o.mat);
      m.castShadow = true; m.userData.z = [Math.random(), Math.random(), Math.random()]; o.stuecke.push(m); o.obj.add(m); }
  } else if (e.art === "uhr") {
    o.mat = mat([245, 240, 230]);
    const d = new T.Mesh(new T.CylinderGeometry(.5, .5, .08, 48), o.mat); d.rotation.x = Math.PI / 2; o.obj.add(d);
    o.zeiger = new T.Mesh(new T.BoxGeometry(.04, .42, .05), mat(farbe)); o.zeiger.geometry.translate(0, .2, .06); o.obj.add(o.zeiger);
  }
  o.obj.traverse((m) => { if (m.isMesh) m.receiveShadow = false; });
  root.add(o.obj); return o;
}

function setzeAlpha(o, a) {
  o.obj.visible = a > .01;
  o.obj.traverse((m) => { if (m.isMesh && m.material) { if (m.material.userData.basis === undefined) m.material.userData.basis = m.material.opacity ?? 1;
    m.material.transparent = true; m.material.opacity = m.material.userData.basis * a; } });
}

window.init = function (daten) {
  size = daten.size; elemente = daten.elemente;
  renderer = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(size, size); renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);
  scene = new T.Scene(); root = new T.Group(); scene.add(root);
  scene.environment = umgebung();                       // Spiegelungen/Glanz wie im Fotostudio
  camera = new T.PerspectiveCamera(30, 1, .1, 200);
  scene.add(new T.HemisphereLight(0xfff4e0, 0x202040, .35));
  const sonne = new T.DirectionalLight(0xffffff, 1.25); sonne.position.set(-5, 8, 12); sonne.castShadow = true;
  sonne.shadow.mapSize.set(1024, 1024); Object.assign(sonne.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
  sonne.shadow.radius = 6; scene.add(sonne);
  const rand = new T.DirectionalLight(0x9fd8ff, .5); rand.position.set(6, -2, -6); scene.add(rand);
  const fang = new T.Mesh(new T.PlaneGeometry(40, 40), new T.ShadowMaterial({ opacity: .28 })); fang.position.z = -1.6; fang.receiveShadow = true; scene.add(fang);
  elemente.forEach((e, i) => { el[e.id] = baue(e); el[e.id].z = i * .12 + (e.art === "figur" ? 0 : .9); });   // Teile vor/in Figuren bleiben sichtbar
  return true;
};

function zeichneBild(b) {                                // b = {t, st: {id: zustand}, kamera: {x,y,f}}
  const t = b.t;
  for (const e of elemente) {
    const o = el[e.id], z = b.st[e.id]; if (!o || !z) continue;
    const g = Math.max(.02, z.g / 100 * W) * (1 + (z.puls || 0));
    setzeAlpha(o, z.alpha);
    if (e.art === "figur" && o.teile) {
      o.obj.position.set(wx(z.x), wy(z.y), o.z); o.obj.scale.setScalar(g);
      o.obj.rotation.y = .18 * Math.sin(t * .6 + e.id.length);              // Figuren drehen sich leicht – echtes 3D
      const k = o.teile.kopf; if (k) k.rotation.z = .04 * Math.sin(t * 1.3) - .38 * (z.picke || 0);
      const s = o.teile.schwanz; if (s) s.rotation.z = .03 * Math.sin(t * 1.7);
      const f = o.teile.fluegel;
      if (f) f.children.forEach((h) => { const s2 = h.userData.seite || 1;
        h.rotation.x = s2 * (e.figur === "biene" ? .35 + .5 * Math.abs(Math.sin(t * 30)) * (.25 + (z.flattere || 0)) : .25 * (z.flattere || 0) * Math.abs(Math.sin(t * 14))); });
      if (o.teile.koerper && e.figur !== "biene") o.teile.koerper.scale.y *= 1;     // Atmen über die ganze Figur:
      o.innen.scale.y = (e.blick < 0 ? 1 : 1) * (1 + .012 * Math.sin(t * 2.4));
    } else if (e.art === "form" || (e.art === "figur" && !o.teile)) {
      o.obj.position.set(wx(z.x), wy(z.y), o.z); o.obj.scale.setScalar(g); o.obj.rotation.z = -z.rot * Math.PI / 180;
      o.obj.rotation.y = .25 * Math.sin(t * .7); o.mat.color.copy(rgb(z.farbe));
      if (o.fluessig) { o.obj.rotation.y = 0; o.fluessig.scale.y = Math.max(.02, Math.min(.98, z.f > 0 ? z.f : .7)); }
    } else if (e.art === "schlauch" || e.art === "pfeil") {
      o.mesh.geometry.setDrawRange(0, Math.floor(o.geo.index.count * Math.max(0, Math.min(1, e.art === "schlauch" && e.f === 0 ? z.f : 1)) / 6) * 6);
      o.mat.color.copy(rgb(z.farbe));
    } else if (e.art === "huelle" || e.art === "schale") {
      const ziel = b.st[e.um]; if (ziel) { o.obj.position.set(wx(ziel.x), wy(ziel.y), 0);
        o.obj.scale.setScalar(Math.max(.01, ziel.g / 100 * W * (1 + (e.art === "huelle" ? z.g / 50 : .12) * z.f))); }
      setzeAlpha(o, z.alpha * (z.f > .01 ? 1 : 0));
    } else if (e.art === "kristalle" && b.st[e.um]) {
      const ziel = b.st[e.um], r = ziel.g / 100 * W / 2;
      o.stuecke.forEach((m, i) => { const [u, v, w] = m.userData.z, a = u * Math.PI * 2, p = Math.acos(2 * v - 1);
        m.visible = i / o.stuecke.length < z.f; m.scale.setScalar(r * .18 * (.6 + w));
        m.position.set(wx(ziel.x) + r * Math.sin(p) * Math.cos(a), wy(ziel.y) + r * Math.cos(p), r * Math.sin(p) * Math.sin(a)); });
    } else if (e.art === "partikel") {
      const von = b.st[e.von] || { x: (e.von || [50])[0], y: (e.von || [0, 50])[1] }, nach = b.st[e.nach] || { x: (e.nach || [50])[0], y: (e.nach || [0, 50])[1] };
      o.stuecke.forEach((m, i) => { const [u, v] = m.userData.z, q = (u + t * .35) % 1;
        m.visible = i / o.stuecke.length < z.f; m.scale.setScalar(.22);
        m.position.set(wx(von.x + (nach.x - von.x) * q) + (v - .5) * .3, wy(von.y + (nach.y - von.y) * q) + Math.sin(q * 9 + i) * .08, (v - .5) * .4 + 1.2); });
    } else if (e.art === "traube") {
      o.obj.position.set(wx(z.x), wy(z.y), 0);
      o.stuecke.forEach((m, i) => { const [u, v, w] = m.userData.z; m.scale.setScalar(g * .32);
        m.position.set((u - .5) * g * .7, (v - .5) * g * .7, (w - .5) * g * .5); });
    } else if (e.art === "uhr") {
      o.obj.position.set(wx(z.x), wy(z.y), 0); o.obj.scale.setScalar(g); o.zeiger.rotation.z = -z.f * Math.PI * 2;
    }
  }
  const k = b.kamera, d = 18.66 / Math.max(1, k.f);       // Kamera: leichte Fahrt + Zoom auf das Ziel
  const zx = wx(k.f > 1.01 ? k.x : 50), zy = wy(k.f > 1.01 ? k.y : 50), sw = .1 * Math.sin(t * .35);
  camera.position.set(zx + Math.sin(sw) * d, zy + d * .1, Math.cos(sw) * d); camera.lookAt(zx, zy, 0); camera.updateMatrixWorld();
  renderer.render(scene, camera);
  const lage = {};                                         // Bildschirmlage je Element (0–100) für die Beschriftungen
  for (const e of elemente) { const o = el[e.id], z = b.st[e.id]; if (!o || !z) continue;
    let p = new T.Vector3(); o.obj.getWorldPosition(p);
    if (e.art === "schlauch" || e.art === "pfeil") p = o.kurve.getPoint(.5);
    else if (e.art !== "figur" && e.art !== "form" && e.art !== "traube" && e.art !== "uhr") p = new T.Vector3(wx(z.x), wy(z.y), 0);
    const r = p.clone().add(new T.Vector3(Math.max(.02, z.g / 100 * W) / 2, 0, 0));
    const a = p.clone().project(camera), c = r.project(camera);
    lage[e.id] = [(a.x + 1) * 50, (1 - a.y) * 50, Math.abs(c.x - a.x) * 100]; }
  return lage;
}

window.bilder = function (liste) {                       // mehrere Bilder auf einmal (spart Wege)
  return liste.map((b) => { const lage = zeichneBild(b); return { png: renderer.domElement.toDataURL("image/png"), lage }; });
};
</script>
