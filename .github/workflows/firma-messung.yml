# Firma-Mitarbeiter „Messung“ (kostenlos, kein Claude-Verbrauch): schreibt firma_daten/, sichert per Bot-Commit.
# Siehe CLAUDE.md, Abschnitt „Firma-Mitarbeiter (GitHub)“ und docs/clip-team.md.
name: Firma · Messung

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firma-daten
  cancel-in-progress: false

jobs:
  messung:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete
        run: pip install requests pyyaml yt-dlp
      - name: Aktuellen Stand holen
        run: git pull --ff-only
      - name: Messung arbeitet
        run: python -m cudi_video.firma messung
      - name: Ergebnis sichern
        run: bash scripts/firma_commit.sh "Messung"
