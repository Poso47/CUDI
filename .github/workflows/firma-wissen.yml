# Firma-Mitarbeiter „Wissens-Sammler“ (wöchentlich, kostenlos: offizielle Blogs/Newsrooms + Europe PMC, Gemini über CUDI_LLM_*,
# kein Claude-Verbrauch): schreibt firma_daten/wissen.json (Regeln mit Quelle + Datum). Siehe CLAUDE.md, „Regie & Psychologie“.
name: Firma · Wissens-Sammler

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Alle Firma-Läufe nacheinander, damit sich die Commits nicht in die Quere kommen
concurrency:
  group: firma-daten
  cancel-in-progress: false

jobs:
  wissen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete
        run: pip install requests pyyaml
      - name: Wissens-Sammler arbeitet
        env:
          CUDI_LLM_BASE_URL: ${{ secrets.CUDI_LLM_BASE_URL }}
          CUDI_LLM_API_KEY: ${{ secrets.CUDI_LLM_API_KEY }}
          CUDI_LLM_MODEL: ${{ secrets.CUDI_LLM_MODEL }}
        run: python -m cudi_video.firma wissen
      - name: Ergebnis sichern
        run: scripts/firma_commit.sh "Wissens-Sammler"
