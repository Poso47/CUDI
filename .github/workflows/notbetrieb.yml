# Notbetrieb (Claude-Limit erreicht): App-Auftrag mit freiem Sprachmodell (CUDI_LLM_*) auf GitHub Actions ausführen.
# Gestartet von „CUDI Auftrag“ (auftrag.yml), wenn das Issue den Auftrag als JSON-Block enthält. Das Ergebnis steht
# als Artefakt am Lauf und als Kommentar im Issue. Doku: docs/notbetrieb-einrichten.md
name: CUDI Notbetrieb

run-name: "Notbetrieb · Auftrag #${{ inputs.issue }}"

on:
  workflow_dispatch:
    inputs:
      auftrag:
        description: "Auftrag als JSON (von auftrag.yml geprüft)"
        required: true
      issue:
        description: "Issue-Nummer – dort wird das Ergebnis gemeldet"
        required: true

permissions:
  contents: read
  issues: write
  actions: read            # Artefakt des früheren Laufs holen (Bearbeiten/Hochladen im Notbetrieb)

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cudi_video/requirements.txt
      - name: System-Pakete
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter
      - name: Python-Pakete
        run: pip install -r cudi_video/requirements.txt
      - name: Auftrag ausführen
        env:
          AUFTRAG: ${{ inputs.auftrag }}
          # Nur gesetzte Secrets wirken; leer = Dienst aus bzw. Textbausteine/Ausweichwege
          CUDI_LLM_BASE_URL: ${{ secrets.CUDI_LLM_BASE_URL }}
          CUDI_LLM_API_KEY: ${{ secrets.CUDI_LLM_API_KEY }}
          CUDI_LLM_MODEL: ${{ secrets.CUDI_LLM_MODEL }}
          # Optionale Ausweichanbieter, falls der erste das Limit meldet (429) – siehe docs/notbetrieb-einrichten.md
          CUDI_LLM2_BASE_URL: ${{ secrets.CUDI_LLM2_BASE_URL }}
          CUDI_LLM2_API_KEY: ${{ secrets.CUDI_LLM2_API_KEY }}
          CUDI_LLM2_MODEL: ${{ secrets.CUDI_LLM2_MODEL }}
          CUDI_LLM3_BASE_URL: ${{ secrets.CUDI_LLM3_BASE_URL }}
          CUDI_LLM3_API_KEY: ${{ secrets.CUDI_LLM3_API_KEY }}
          CUDI_LLM3_MODEL: ${{ secrets.CUDI_LLM3_MODEL }}
          CUDI_BRAVE_API_KEY: ${{ secrets.CUDI_BRAVE_API_KEY }}
          CUDI_PEXELS_API_KEY: ${{ secrets.CUDI_PEXELS_API_KEY }}
          CUDI_PIXABAY_API_KEY: ${{ secrets.CUDI_PIXABAY_API_KEY }}
          CUDI_DEEPL_API_KEY: ${{ secrets.CUDI_DEEPL_API_KEY }}
          CUDI_REDDIT_CLIENT_ID: ${{ secrets.CUDI_REDDIT_CLIENT_ID }}
          CUDI_REDDIT_CLIENT_SECRET: ${{ secrets.CUDI_REDDIT_CLIENT_SECRET }}
          CUDI_POLLINATIONS_TOKEN: ${{ secrets.CUDI_POLLINATIONS_TOKEN }}
          CUDI_CHANNEL: ${{ secrets.CUDI_CHANNEL }}
          CUDI_YT_CLIENT_ID: ${{ secrets.CUDI_YT_CLIENT_ID }}
          CUDI_YT_CLIENT_SECRET: ${{ secrets.CUDI_YT_CLIENT_SECRET }}
          CUDI_YT_REFRESH_TOKEN: ${{ secrets.CUDI_YT_REFRESH_TOKEN }}
          CUDI_TIKTOK_CLIENT_KEY: ${{ secrets.CUDI_TIKTOK_CLIENT_KEY }}
          CUDI_TIKTOK_CLIENT_SECRET: ${{ secrets.CUDI_TIKTOK_CLIENT_SECRET }}
          CUDI_TIKTOK_REFRESH_TOKEN: ${{ secrets.CUDI_TIKTOK_REFRESH_TOKEN }}
          CUDI_TIKTOK_ACCESS_TOKEN: ${{ secrets.CUDI_TIKTOK_ACCESS_TOKEN }}
          CUDI_IG_USER_ID: ${{ secrets.CUDI_IG_USER_ID }}
          CUDI_IG_ACCESS_TOKEN: ${{ secrets.CUDI_IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python .github/scripts/notbetrieb.py run 2>&1 | tee cudi.log
      - name: Videos als Artefakt sichern
        id: artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudi-notbetrieb-${{ inputs.issue }}-${{ github.run_number }}
          path: |
            video_output/auftrag-*/**/*.mp4
            !video_output/auftrag-*/**/*_app*.mp4
            video_output/auftrag-*/**/*.jpg
            video_output/auftrag-*/**/review.md
            video_output/auftrag-*/ergebnis.json
            video_output/auftrag-*/bearbeitung.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload-Liste für den Lern-Analysten sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploads-neu-${{ inputs.issue }}-${{ github.run_number }}
          path: |
            video_output/uploads_neu.json
            video_output/abgleich_neu.json
          if-no-files-found: ignore
          retention-days: 2
      - name: Ergebnis im Auftrag melden
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          ARTIFACT_URL: ${{ steps.artefakt.outputs.artifact-url }}
          CUDI_LLM_API_KEY: ${{ secrets.CUDI_LLM_API_KEY }}
          CUDI_LLM2_API_KEY: ${{ secrets.CUDI_LLM2_API_KEY }}
          CUDI_LLM3_API_KEY: ${{ secrets.CUDI_LLM3_API_KEY }}
        run: python .github/scripts/notbetrieb.py melden

  # Videos als Release-Dateien: ein Tipp auf den Link im Auftrag spielt das Video ab (ohne Anmeldung, ohne ZIP).
  # Eigener Job mit Schreibrecht – er führt keinen Auftrags-Code aus, sondern legt nur die fertigen Dateien ab.
  direkt:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cudi-notbetrieb-${{ inputs.issue }}-${{ github.run_number }}
          path: fertig
      - name: Release anlegen und Link im Auftrag nennen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob globstar
          files=()
          for f in fertig/**/*.mp4; do
            case "$f" in */work/*) ;; *) files+=("$f") ;; esac
          done
          [ ${#files[@]} -eq 0 ] && exit 0
          tag="notbetrieb-${{ inputs.issue }}-${{ github.run_number }}"
          gh release create "$tag" "${files[@]}" --prerelease --title "Notbetrieb-Auftrag #${{ inputs.issue }}" \
            --notes "Videos zum Auftrag #${{ inputs.issue }}. Wird nach 14 Tagen automatisch gelöscht."
          {
            echo "### ▶ Video direkt ansehen oder speichern"
            gh release view "$tag" --json assets --jq '.assets[] | "- [" + .name + "](" + .url + ")"'
            echo
            echo "Antippen genügt – ohne Anmeldung, ohne ZIP. Die Links gelten 14 Tage und sind öffentlich."
          } > kommentar.md
          gh issue comment "${{ inputs.issue }}" --body-file kommentar.md
          gh release list --limit 100 --json tagName,createdAt \
            --jq '.[] | select(.tagName | startswith("notbetrieb-")) | select(.createdAt < (now - 1209600 | todate)) | .tagName' \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done

  # Nach einem Upload: Eintrag (Video -> Varianten) in firma_daten/uploads.json, damit der Lern-Analyst die Zahlen zuordnen kann.
  # Nur dieser Workflow schreibt die Liste (Claude-Läufe committen nie).
  liste:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: firma-daten
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete
        run: pip install requests pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: uploads-neu-${{ inputs.issue }}-${{ github.run_number }}
          path: neu
        continue-on-error: true
      - name: Upload-Liste ergänzen
        run: |
          if [ -f neu/uploads_neu.json ]; then
            python -m cudi_video.firma uploads neu/uploads_neu.json
            bash scripts/firma_commit.sh "Upload-Liste"
          else
            echo "Kein Upload in diesem Lauf."
          fi
      - name: Bild-Lücken für den Bildlehrer sammeln
        run: |
          if [ -f neu/abgleich_neu.json ]; then
            python -m cudi_video.firma abgleich neu/abgleich_neu.json
            bash scripts/firma_commit.sh "Bild-Abgleich"
          else
            echo "Keine Bild-Lücken in diesem Lauf."
          fi
