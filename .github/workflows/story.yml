# Reddit-Story-Video in der Cloud erzeugen – startbar vom Handy (CUDI-App-Seite in Claude oder GitHub-App).
name: CUDI Story

run-name: "Story: ${{ inputs.wunsch || inputs.stimmung }} (${{ inputs.sprache }}, ${{ inputs.laenge }})"

on:
  workflow_dispatch:
    inputs:
      wunsch:
        description: "Beschreibung oder Reddit-Link (z. B. gruselige Story über einen Stalker im Wald)"
        required: false
        default: ""
      stimmung:
        description: "Stimmung"
        type: choice
        options: [auto, creepy, suspense, funny, drama, revenge, wholesome]
        default: auto
      sprache:
        description: "Sprache"
        type: choice
        options: [de, en]
        default: de
      laenge:
        description: "Länge"
        type: choice
        options: [kurz, 3min, teile]
        default: 3min
      bilder:
        description: "Bilder"
        type: choice
        options: [videos, images, gameplay]
        default: videos
      entschaerfen:
        description: "Heikles entschärfen (umschreiben statt weglassen)"
        type: boolean
        default: true

permissions:
  contents: write          # Ergebnis-Zusammenfassung im Zweig cudi-ergebnisse (für die CUDI-App-Seite)

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cudi_video/requirements.txt
      - name: System-Pakete
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter
      - name: Python-Pakete
        run: pip install -r cudi_video/requirements.txt
      - name: Story-Video erzeugen
        env:
          WUNSCH: ${{ inputs.wunsch }}
          STIMMUNG: ${{ inputs.stimmung }}
          SPRACHE: ${{ inputs.sprache }}
          LAENGE: ${{ inputs.laenge }}
          BILDER: ${{ inputs.bilder }}
          ENTSCHAERFEN: ${{ inputs.entschaerfen }}
          CUDI_PEXELS_API_KEY: ${{ secrets.CUDI_PEXELS_API_KEY }}
          CUDI_PIXABAY_API_KEY: ${{ secrets.CUDI_PIXABAY_API_KEY }}
          CUDI_LLM_BASE_URL: ${{ secrets.CUDI_LLM_BASE_URL }}
          CUDI_LLM_API_KEY: ${{ secrets.CUDI_LLM_API_KEY }}
          CUDI_LLM_MODEL: ${{ secrets.CUDI_LLM_MODEL }}
          CUDI_DEEPL_API_KEY: ${{ secrets.CUDI_DEEPL_API_KEY }}
          CUDI_REDDIT_CLIENT_ID: ${{ secrets.CUDI_REDDIT_CLIENT_ID }}
          CUDI_REDDIT_CLIENT_SECRET: ${{ secrets.CUDI_REDDIT_CLIENT_SECRET }}
          CUDI_POLLINATIONS_TOKEN: ${{ secrets.CUDI_POLLINATIONS_TOKEN }}
          CUDI_CHANNEL: ${{ secrets.CUDI_CHANNEL }}
        run: |
          set -o pipefail
          ARGS=(--sprache "$SPRACHE" --laenge "$LAENGE" --bilder "$BILDER")
          if [ "$STIMMUNG" != "auto" ]; then ARGS+=(--stimmung "$STIMMUNG"); fi
          if [ -z "$WUNSCH" ] && [ "$STIMMUNG" = "auto" ]; then ARGS+=(--stimmung creepy); fi
          if [ "$ENTSCHAERFEN" = "false" ]; then ARGS+=(--nicht-entschaerfen); fi
          python -m cudi_video story "$WUNSCH" "${ARGS[@]}" 2>&1 | tee cudi.log
      - name: Ergebnis für die CUDI-App ablegen
        if: always()
        run: python .github/scripts/publish_result.py video_output cudi.log story
      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudi-story-${{ github.run_number }}
          path: |
            video_output/**/*.mp4
            video_output/**/*.jpg
            video_output/**/*.srt
            video_output/**/*.txt
            video_output/**/review.md
          if-no-files-found: ignore
          retention-days: 14
